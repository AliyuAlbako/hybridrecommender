services:
  - type: web
    name: hybrid-recommender
    env: python
    plan: free
    buildCommand: |
      cd ecomm_recommender
      pip install -r ../requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn ecomm_recommender.wsgi:application --log-file -
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: ecomm_recommender.settings
      - key: PYTHON_VERSION
        value: 3.13
    autoDeploy: true
